<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Quiz Dashboard & Reverse Proxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b1120;
            --bg-side: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #26354a;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --accent-light: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 340px;
            background: var(--bg-side);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .side-head {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-online {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .proxy-launcher-box {
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .lbl { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }

        .url-inp {
            width: 100%;
            background: #0b1120;
            border: 1px solid var(--border);
            color: white;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            outline: none;
        }
        .url-inp:focus { border-color: var(--primary); }

        .btn-launch {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-launch:hover { opacity: 0.9; }

        .exam-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .exam-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .exam-item:hover { background: var(--bg-card-hover); }
        .exam-item.active {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.12);
        }

        .exam-item-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; line-height: 1.35; }
        .exam-item-meta { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            padding: 16px 24px;
            background: var(--bg-side);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-title { font-size: 17px; font-weight: 800; }
        .main-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .toolbar { display: flex; gap: 8px; }

        .btn {
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-card-hover); }
        .btn-p { background: var(--primary); border-color: var(--primary); color: white; }
        .btn-p:hover { background: var(--primary-hover); }

        .filter-row {
            padding: 10px 24px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: white;
            font-size: 12.5px;
            outline: none;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
        }
        .q-head {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .q-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-light);
            font-family: var(--mono);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .q-text { font-size: 14.5px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
        .opt-grid { display: flex; flex-direction: column; gap: 6px; }
        .opt-row {
            background: rgba(11, 17, 32, 0.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            color: #cbd5e1;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 9999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="side-head">
            <div class="logo">⚡ CLOUD PROXY</div>
            <span class="badge-online">Render Active</span>
        </div>

        <div class="proxy-launcher-box">
            <label class="lbl">🚀 Mở Web Test Qua Reverse Proxy:</label>
            <input type="text" class="url-inp" id="inp-target-url" placeholder="https://example.com/quiz..." />
            <button class="btn-launch" id="btn-open-proxy">Mở & Tự Động Tiêm Mã</button>
        </div>

        <div class="exam-list" id="exam-list">
            <!-- Danh sách đề thi -->
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <header class="top-bar">
            <div>
                <h1 class="main-title" id="disp-title">Chọn đề thi từ danh sách</h1>
                <div class="main-meta" id="disp-meta">Thời gian: -- | Nguồn: --</div>
            </div>
            <div class="toolbar" id="toolbar" style="display:none;">
                <button class="btn btn-p" id="btn-copy">📋 Copy JSON</button>
                <button class="btn" id="btn-dl">💾 Download JSON</button>
                <button class="btn" id="btn-txt">📄 Xuất File TXT</button>
            </div>
        </header>

        <div class="filter-row" id="filter-row" style="display:none;">
            <input type="text" class="search-box" id="search-input" placeholder="Tìm kiếm câu hỏi, đáp án, index..." />
            <span id="stat-showing" style="font-size:12px; color:var(--text-muted);">Hiển thị: 0 câu</span>
        </div>

        <div class="content-area" id="content-area">
            <div style="text-align:center; padding:80px 20px; color:var(--text-muted);">
                <div style="font-size:36px; margin-bottom:12px;">☁️</div>
                <h3 style="font-size:16px; font-weight:700; color:white; margin-bottom:6px;">Sẵn sàng nhận dữ liệu từ Reverse Proxy</h3>
                <p style="font-size:13px; max-width:460px; margin:0 auto; line-height:1.6;">
                    Nhập URL website bài thi ở thanh bên trái và bấm <strong>Mở & Tự Động Tiêm Mã</strong>. Script sẽ tự động bóc và truyền dữ liệu về đây.
                </p>
            </div>
        </div>
    </main>

    <div class="toast" id="toast">Thông báo</div>

    <script>
        let exams = [];
        let selected = null;
        let lastCount = 0;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function fetchExams() {
            try {
                const res = await fetch('/api/exams');
                const list = await res.json();
                if (list.length > lastCount && lastCount !== 0) {
                    showToast(`Nhận được bài thi mới: "${list[0].metadata?.pageTitle || 'Đề thi'}"`);
                }
                lastCount = list.length;
                exams = list;
                renderList();
                if (!selected && exams.length > 0) selectExam(exams[0].id);
            } catch (e) {}
        }

        function renderList() {
            const el = document.getElementById('exam-list');
            if (exams.length === 0) {
                el.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px;">Chưa có đề thi nào.</div>';
                return;
            }

            el.innerHTML = exams.map(item => {
                const isAct = selected && selected.id === item.id ? 'active' : '';
                const title = item.metadata?.pageTitle || 'Đề thi trích xuất';
                const time = new Date(item.receivedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="exam-item ${isAct}" onclick="selectExam('${item.id}')">
                        <div class="exam-item-title">${escapeHTML(title)}</div>
                        <div class="exam-item-meta">
                            <span>🕒 ${time}</span>
                            <span style="color:var(--accent); font-weight:700;">${item.questions?.length || 0} câu</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectExam(id) {
            selected = exams.find(e => e.id === id);
            renderList();
            if (!selected) return;

            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('filter-row').style.display = 'flex';
            document.getElementById('disp-title').textContent = selected.metadata?.pageTitle || 'Đề thi';
            document.getElementById('disp-meta').textContent = `Nhận lúc: ${new Date(selected.receivedAt).toLocaleString()} | Nguồn: ${selected.metadata?.sourceUrl || 'N/A'}`;

            renderQuestions();
        }

        function renderQuestions() {
            if (!selected) return;
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            const container = document.getElementById('content-area');

            const filtered = (selected.questions || []).filter(item => {
                if (!q) return true;
                return (item.question || '').toLowerCase().includes(q) || String(item.index).includes(q);
            });

            document.getElementById('stat-showing').textContent = `Hiển thị: ${filtered.length} / ${selected.questions.length} câu`;

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Không tìm thấy câu hỏi phù hợp.</div>';
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="q-card">
                    <div class="q-head">
                        <span class="q-tag">#Index: ${item.index}</span>
                        <span>ID: ${escapeHTML(item.questionId || 'N/A')} | Nguồn: ${item.indexSource || 'auto'}</span>
                    </div>
                    <div class="q-text">${escapeHTML(item.question)}</div>
                    ${item.options ? `<div class="opt-grid">${item.options.map(o => `<div class="opt-row">${escapeHTML(o)}</div>`).join('')}</div>` : ''}
                </div>
            `).join('');
        }

        function escapeHTML(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        document.getElementById('btn-open-proxy').addEventListener('click', () => {
            let u = document.getElementById('inp-target-url').value.trim();
            if (!u) return alert('Vui lòng nhập URL website bài thi!');
            if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
            window.open(`/proxy?url=${encodeURIComponent(u)}`, '_blank');
        });

        document.getElementById('search-input').addEventListener('input', renderQuestions);

        document.getElementById('btn-copy').addEventListener('click', () => {
            if (!selected) return;
            navigator.clipboard.writeText(JSON.stringify(selected.questions, null, 2));
            showToast('Đã copy toàn bộ JSON câu hỏi!');
        });

        document.getElementById('btn-dl').addEventListener('click', () => {
            if (!selected) return;
            const blob = new Blob([JSON.stringify(selected, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `exam_${selected.id}.json`;
            a.click();
        });

        document.getElementById('btn-txt').addEventListener('click', () => {
            if (!selected) return;
            let txt = `ĐỀ THI: ${selected.metadata?.pageTitle || ''}\nNGUỒN: ${selected.metadata?.sourceUrl || ''}\n\n`;
            selected.questions.forEach(q => {
                txt += `Câu ${q.index}: ${q.question}\n`;
                if (q.options) q.options.forEach(o => txt += `   ${o}\n`);
                txt += '\n';
            });
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `exam_${selected.id}.txt`;
            a.click();
        });

        setInterval(fetchExams, 2500);
        fetchExams();
    </script>
</body>
</html>
